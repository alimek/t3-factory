name: Feature request
description: Propose an improvement to a real workflow.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who needs this and the workflow that is difficult today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain the behavior you would like, with a concrete example if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any current workaround and why it is insufficient.
