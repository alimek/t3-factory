name: Desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Prepare draft for release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync("apps/desktop/package.json", "utf8")).version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          fi
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | .draft")
          if [[ -n "$existing" && "$existing" != true ]]; then
            echo '::error::A published release cannot be replaced. Increase the desktop version.'
            exit 1
          fi
          mkdir -p .e2e/release
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            --jq .body > .e2e/release/notes.md
          if [[ "$existing" = true ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "T3 Factory $tag" \
              --prerelease=false --notes-file .e2e/release/notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "T3 Factory $tag" \
              --draft --notes-file .e2e/release/notes.md
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check build host
        run: |
          test "$(uname -m)" = arm64
          mkdir -p .e2e/release
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check controlled UI journeys
        run: |
          pnpm exec e2e-web install chromium
          pnpm exec e2e run --trace on --output .e2e/release/journeys
      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          FACTORY_UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          FACTORY_UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing release secret: $name"
              exit 1
            fi
          done
          export APPLE_API_KEY="$RUNNER_TEMP/factory-notary-key.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY")
          pnpm desktop:package:release
      - name: Verify packaged application
        run: |
          app='apps/desktop/release/mac-arm64/T3 Factory.app'
          codesign --verify --deep --strict --verbose=2 -R='anchor apple generic' "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          pnpm desktop:probe "$PWD/.e2e/release/packaged-probe.json"
          hdiutil verify apps/desktop/release/*.dmg
          unzip -t apps/desktop/release/*.zip
      - name: Hash release downloads
        working-directory: apps/desktop/release
        run: shasum -a 256 -- *.dmg *.zip *.blockmap latest-mac.yml > SHA256SUMS.txt
      - name: Attach downloads to prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            apps/desktop/release/*.dmg apps/desktop/release/*.zip \
            apps/desktop/release/*.blockmap apps/desktop/release/latest-mac.yml \
            apps/desktop/release/SHA256SUMS.txt
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json url --jq '"Draft release: " + .url' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep downloads and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ github.sha }}
          include-hidden-files: true
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/SHA256SUMS.txt
            .e2e/release/
      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/factory-notary-key.p8"
