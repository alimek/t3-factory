name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to rebuild and publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  release-please:
    name: Release PR and cut
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  source:
    name: Resolve release source
    needs: release-please
    if: >-
      !cancelled() && needs.release-please.result != 'failure' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Listing draft releases requires push access; this job runs no repository code.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_TAG: ${{ inputs.tag }}
          CUT_TAG: ${{ needs.release-please.outputs.tag }}
          CUT_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          tag=${CUT_TAG:-$DISPATCHED_TAG}
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like vX.Y.Z, got '$tag'."
            exit 1
          fi
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | {draft, target: .target_commitish}" | jq -s .)
          if [[ "$(jq length <<<"$releases")" != 1 ]]; then
            echo "::error::Expected exactly one release for $tag, found $(jq length <<<"$releases")."
            exit 1
          fi
          if [[ "$(jq -r '.[0].draft' <<<"$releases")" != true ]]; then
            echo "::error::$tag is already published; published releases are never rebuilt or replaced."
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [[ "$(jq -r '.[0].target' <<<"$releases")" != "$sha" ]]; then
            echo "::error::The $tag draft does not target the tagged commit $sha."
            exit 1
          fi
          if [[ -n "$CUT_SHA" && "$CUT_SHA" != "$sha" ]]; then
            echo "::error::$tag points to $sha, not the release commit $CUT_SHA."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build
    needs: source
    if: ${{ !cancelled() && needs.source.result == 'success' }}
    concurrency:
      group: release-build-${{ needs.source.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      channel: release
      release-version: ${{ needs.source.outputs.version }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [source, build-macos]
    if: ${{ !cancelled() && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    concurrency:
      group: release-publish-${{ needs.source.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.source.outputs.tag }}
          path: downloads
      - name: Verify downloads
        working-directory: downloads
        run: |
          base="T3.Factory-$RELEASE_VERSION-arm64"
          printf '%s\n' "$base.dmg" "$base.dmg.blockmap" "$base.zip" "$base.zip.blockmap" \
            SHA256SUMS.txt latest-mac.yml | sort > ../expected-files.txt
          ls -1 | sort > ../actual-files.txt
          diff -u ../expected-files.txt ../actual-files.txt
          sha256sum --check --strict SHA256SUMS.txt
          test "$(awk '{print $2}' SHA256SUMS.txt | sort)" = "$(grep -v '^SHA256SUMS.txt$' ../expected-files.txt)"
          grep -qx "version: $RELEASE_VERSION" latest-mac.yml
      - name: Check release is still an unchanged draft
        run: |
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | {id, draft, target: .target_commitish}" | jq -s .)
          test "$(jq length <<<"$release")" = 1
          if [[ "$(jq -r '.[0].draft' <<<"$release")" != true ]]; then
            echo "::error::$RELEASE_TAG was published outside this job; its assets are not changed."
            exit 1
          fi
          test "$(jq -r '.[0].target' <<<"$release")" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          echo "RELEASE_ID=$(jq -r '.[0].id' <<<"$release")" >> "$GITHUB_ENV"
      - name: Upload the complete asset set
        run: |
          # Only assets of a still-draft release left by an earlier failed attempt are removed.
          for asset in $(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
          done
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" downloads/*
      - name: Verify uploaded assets
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | "\(.digest | sub("^sha256:"; ""))  \(.name)"' | sort -k2 > uploaded.txt
          (cd downloads && sha256sum -- *) | sort -k2 > local.txt
          diff -u local.txt uploaded.txt
      - name: Publish
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .tag_name <<<"$release")" = "$RELEASE_TAG"
          jq -r '.assets[] | "\(.digest | sub("^sha256:"; ""))  \(.name)"' <<<"$release" | sort -k2 > published.txt
          diff -u local.txt published.txt
          jq -r '"Published release: " + .html_url' <<<"$release" >> "$GITHUB_STEP_SUMMARY"
