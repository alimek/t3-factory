name: UI evidence

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/ui-evidence.yml"

permissions: {}

jobs:
  attachments:
    name: UI evidence attachments
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Before and After images
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { pull_request: pr } = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const body = (pr.body ?? '').replace(/<!--[\s\S]*?-->/g, '');
          const section = body.match(/^## UI screenshots\s*\n([\s\S]*?)(?=^## |$(?![\s\S]))/m)?.[1] ?? '';
          const image = /!\[[^\]]*\]\(https:\/\/[^\s)]+\)/;
          for (const label of ['Before', 'After']) {
            const block = section.match(new RegExp(`^### ${label}\\s*\\n([\\s\\S]*?)(?=^### |$(?![\\s\\S]))`, 'm'))?.[1] ?? '';
            if (!image.test(block)) {
              console.error(`::error::UI changes require an embedded HTTPS image under "### ${label}" in "## UI screenshots". See verify-t3-factory Evidence.`);
              process.exitCode = 1;
            }
          }
          JS
