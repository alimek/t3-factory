name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-commit:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Squash merges use the PR title as the commit that release-please reads.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|refactor|docs|test|build|ci|chore|style)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'fix(desktop): keep update state', got: $TITLE"
            exit 1
          fi
