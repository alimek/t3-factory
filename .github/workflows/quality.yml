name: Quality

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}-${{ (github.event.action == 'edited' && !github.event.changes.base) && 'metadata' || 'code' }}
  cancel-in-progress: true

jobs:
  check:
    # Keep edited for base retargets; rename metadata skips so skipped success cannot mask Quality gate.
    if: github.event.action != 'edited' || github.event.changes.base
    name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'Quality gate not rerun for PR metadata edit' || 'Quality gate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check Git attribution and squash input
        if: github.event_name == 'push'
        run: node scripts/check-git-attribution.mjs --event "$GITHUB_EVENT_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
