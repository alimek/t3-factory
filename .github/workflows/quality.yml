name: Quality

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  RUN_CODE: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}

concurrency:
  group: quality-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && '-metadata' || '' }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: env.RUN_CODE == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: ${{ env.RUN_CODE == 'true' && 'pnpm' || '' }}
      - name: Reuse existing code validation
        if: env.RUN_CODE != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reuse-quality-gate.mjs
      - name: Check Git attribution and squash input
        if: github.event_name == 'push'
        run: node scripts/check-git-attribution.mjs --event "$GITHUB_EVENT_PATH"
      - name: "Full code gate for PR ${{ github.event.pull_request.number || 0 }}: ${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}"
        if: env.RUN_CODE == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm check
