version: 1.0

# Issues are specs in the GitHub tracker; review pull requests only.
issues: false

user_settings:
  min_severity: minor
  skeptic_pass: true

  # One deeper review per push instead of findings trickling in over several pushes.
  max_rounds: 2
  # The deployment plans 600s per review: max_rounds × (timeout_ms + closing_ms) must fit.
  timeout_ms: 240000
  closing_ms: 60000
  default_thinking_level: medium
