# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Be concise and concrete. Report only actionable defects; skip style nits the formatter and linter already enforce."
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  suggested_labels: true
  auto_apply_labels: true
  labeling_instructions:
    - label: bug
      instructions: "Fixes incorrect existing behavior (fix: PR title)."
    - label: enhancement
      instructions: "Adds a new feature or user-visible capability (feat: PR title)."
    - label: documentation
      instructions: "Changes only documentation, with no runtime code change."
    - label: accessibility
      instructions: "Removes a barrier for people with disabilities."
  suggested_reviewers: false
  abort_on_close: true
  finishing_touches:
    # docs/testing.md adds tests only for unprotected regressions; comments explain constraints only.
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    # Conventional title is enforced by .github/workflows/pull-request-title.yml.
    title:
      mode: "off"
    description:
      mode: warning
    custom_checks:
      - name: "PR outcome and verification"
        mode: warning
        instructions: |
          The PR description states the outcome, how it was verified, the
          documentation impact (or that none is needed), and any migration or
          intentional contract break with affected callers/data.
      - name: "Development scenarios updated"
        mode: warning
        instructions: |
          If the PR changes user-visible states, Run transitions, readiness or
          demo data, docs/dev-scenarios.md scenario catalog is updated in the same PR.
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - "chore(main): release"
  path_filters:
    - "!pnpm-lock.yaml"
    - "!CHANGELOG.md"
    - "!.release-please-manifest.json"
    - "!**/dist/**"
    - "!.e2e/**"
  path_instructions:
    - path: "**/*"
      instructions: |
        Review against AGENTS.md and docs/quality-gates.md#change-review.
        Flag: superseded code, flags or tests left beside a replacement; speculative
        abstractions or pass-through wrappers; redundant guards, silent defaults or
        catch-and-continue inside validated boundaries; comments that narrate code.
        Formatting, lint, types, unused code and duplication are enforced by
        `pnpm check` (Vite+, fallow, tsc); do not comment on them.
    - path: "apps/backend/**"
      instructions: |
        Check untrusted input is validated at boundaries and errors are handled at
        the owning boundary. Stored-data changes must follow docs/foundation.md#sql-migrations
        and must not silently drop or reset data.
    - path: "packages/contracts/**"
      instructions: |
        Contract changes must update every caller in the same PR; flag retained
        legacy versions without an explicit external compatibility requirement.
    - path: "**/*.{test,spec}.ts"
      instructions: "Apply docs/testing.md: flag tests that duplicate existing protection or test implementation details."
    - path: "docs/**"
      instructions: |
        Documentation must be English, public-safe, describe implemented behavior
        (proposals belong in issues), and avoid source-file/function catalogs.
        Check links and GLOSSARY.md terms stay consistent.
  tools:
    # Already enforced by `pnpm check`.
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    markdownlint:
      enabled: false
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/quality-gates.md"
      - "docs/testing.md"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
